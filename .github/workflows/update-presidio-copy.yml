name: Update Presidio homepage copy

on:
  push:
    paths:
      - '.github/workflows/update-presidio-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update homepage copy and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = "<p>Presidio Heights sits directly beside the Presidio, a 1,491-acre national park site with miles of trails, recreation, historic places, gardens, beaches, and sweeping views. For residents, the park is not simply a destination nearby. It is part of the neighborhood's everyday landscape.</p><p>Presidio Tunnel Tops adds another major community resource, with Golden Gate views, public lawns, picnic areas, trails, the Outpost nature playground, the Field Station, and easy access to Crissy Field.</p>"
          new = "<p>Presidio Heights sits directly beside the Presidio, a 1,491-acre national park site with miles of trails, recreation, historic places, gardens, beaches, and sweeping views. For residents, the park is not simply a destination nearby. It is part of the neighborhood's everyday landscape, woven into the places we walk, play, and gather. Just beyond our streets, the Presidio Gate opens onto Lovers Lane, one of the park's oldest footpaths, while Presidio Wall Park offers playgrounds, fields, courts, picnic areas, and views across the park. These close connections make the Presidio feel less like a nearby destination and more like an extension of the neighborhood itself.</p><p>Presidio Tunnel Tops adds another major community resource, with Golden Gate views, public lawns, picnic areas, trails, the Outpost nature playground, the Field Station, and easy access to Crissy Field.</p>"
          if old not in text:
              raise SystemExit('Expected homepage Presidio copy was not found')
          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/update-presidio-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-presidio-copy.yml
          git commit -m "Expand Presidio neighborhood copy"
          git push
